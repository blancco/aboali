    /* ═══════════════════════════════════════════════════════════════
   ذكاء الملاحظات — استخراج المكونات من وصف الوجبة تلقائياً
   ═══════════════════════════════════════════════════════════════ */
const BASE_WORDS = [
  'لحم','دجاج','فلافل','شاورما','برغر','سمك',
  'أرز','رز',
  'صمون','خبز','عيش','عراقي','فرنسي','حجري','سوري','صاج','محمرة',
  'كيلو','كيلوغرام','غرام','غ','نص','قطع','قطعة','قرص','اقراص','أقراص','عدد',
  'شرائح','شخص','أشخاص','طازج','ساخن','بارد','صغير','وسط','كبير','دبل','عائلي',
  'ماء','مياه'
];

const KNOWN_SAUCES = ['طحينة','طحينية','طرطور','ثوم','ثومية','جبن','جبنة','شطة','شيدر','باربكيو','كوكتيل','ماسترد','هني','خاص'];

function _normWord(w){
  let nw = w;
  if(nw.startsWith('بال') && nw.length > 4) nw = nw.slice(3);
  else if(nw.startsWith('لل') && nw.length > 4) nw = nw.slice(2);
  else if(nw.startsWith('ال') && nw.length > 3) nw = nw.slice(2);
  else if(nw.startsWith('ب') && nw.length > 2) nw = nw.slice(1);
  return nw;
}

function _containsBase(s){
  const words = s.split(/\s+/);
  for(const w of words){
    if(BASE_WORDS.includes(_normWord(w))) return true;
  }
  return false;
}

function _shouldSkip(s){
  if(/^\s*\(\d+\)/.test(s)) return true;
  if(/^\d/.test(s)) return true;
  if(/^عدد\s*\d+/.test(s)) return true;
  if(/^(نص\s+)?كيلو/.test(s)) return true;
  if(/غرام/.test(s)) return true;
  return false;
}

function _cleanPart(s){
  return s
    .replace(/\([^)]*\)/g, '')
    .replace(/\d+/g, '')
    .replace(/^عدد\s*/i, '')
    .replace(/^و\s*/, '')
    .replace(/\s+/g, ' ')
    .trim();
}

function _normalizeDisplay(d){
  return d
    .replace(/^خضراوات$/, 'خضروات')
    .replace(/^خضار$/, 'خضروات')
    .replace(/^(طرطور|طحينية|طحينه|الطحينة)$/, 'طحينة')
    .replace(/^ثوميه$/, 'ثوم');
}

function _displayName(s){
  let d = s
    .replace(/^ال(?=[^ ]{2})/, '')
    .trim();
  const stripped = d.replace(/^(صوص|كريم)\s+/, '');
  if(stripped !== d){
    const strippedClean = stripped.replace(/^ال(?=[^ ]{2})/, '').trim();
    if(strippedClean.length >= 3 && KNOWN_SAUCES.some(k=>strippedClean.includes(k))){
      d = strippedClean;
    }
  }
  return _normalizeDisplay(d);
}


function getChipsForItem(itemName){
  const d = desc(itemName);
  if(!d || !d.trim()) return [];

  /* ═══ تحويل " و" (واو العطف) إلى فاصل | ═══ */
  const marked = d.replace(/([\u0621-\u064A])\s+و\s*/g, '$1|');
  const parts = marked.split(/[\-+،,\/|]/).map(s=>s.trim()).filter(Boolean);

  const chips = [];
  const seen = new Set();
  const sauceItems = [];

  for(const part of parts){
    if(_shouldSkip(part)) continue;
    const clean = _cleanPart(part);
    if(!clean || clean.length < 2) continue;
    if(_containsBase(clean)) continue;

    const display = _displayName(clean);
    if(!display || display.length < 2) continue;
    if(BASE_WORDS.includes(display)) continue;

    /* ═══ استثناء الحار من المكونات — سيُضاف كخيار منفصل ═══ */
    if(display === 'حار' || display === 'حارة' || display === 'شطة' || display === 'حرّاق') continue;

    if(seen.has(display)) continue;
    seen.add(display);

    chips.push('بدون ' + display);

    if(KNOWN_SAUCES.some(k=>display.includes(k))){
      sauceItems.push(display);
    }
  }

  for(const s of sauceItems){
    const chip = 'إضافة ' + s;
    if(!chips.includes(chip)) chips.push(chip);
  }

  /* ═══ الحار: دائماً كخيارين منفصلين معاً ═══ */
  chips.push('حار');
  chips.push('بدون حار');

  const hasPickle = [...seen].some(s=>s.includes('مخلل') || s.includes('طرشي'));
  if(hasPickle) chips.push('مخلل على جنب');

  const hasGarlic = [...seen].some(s=>s.includes('ثوم'));
  if(hasGarlic) chips.push('ثومية على جنب');

  return chips;
}

    let S;try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
    if(!S||!S.menu)S=JSON.parse(JSON.stringify(DEF));
    S.t=S.t||{};
    if(S.hist)delete S.hist;
    S.menu.forEach(c=>{c.i=c.i||[];c.i.forEach(it=>{if(it.p==null)it.p=0})});
    Object.values(S.t).forEach(t=>{(t.l||[]).forEach(x=>{if(x.pr==null)x.pr=0})});
    Object.values(S.t).forEach(t=>{
      if(t.w===true)t.w=1;
      else if(t.w===false||t.w==null)t.w=0;
      else if(typeof t.w!=='number')t.w=0;
    });

    let V={p:'home',n:0,ci:0,cat:0,d:-1};
    let Q={ps:'',ms:''};

    function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){console.warn('save error',e)}}
    const T=n=>S.t[n]||(S.t[n]={occ:false,p:0,w:false,l:[]});
    const desc=n=>{for(const m of S.menu)for(const x of m.i)if(x.n==n)return x.d||'';return''};
    const menuPrice=n=>{for(const m of S.menu)for(const x of m.i)if(x.n==n)return x.p||0;return 0};
    const itemPrice=x=>x.pr!=null?x.pr:menuPrice(x.n);
    const mn=a=>a?Math.max(0,Math.floor((Date.now()-a)/60000)):'';
    const mnTxt=m=>m<60?m+' د':Math.floor(m/60)+' س '+((m%60)?(m%60)+' د':'');
    const lineTotal=x=>itemPrice(x)*x.q;
    const tTotal=t=>(t.l||[]).reduce((s,x)=>s+lineTotal(x),0)+((t.w||0)*WATER_PRICE);

    function render(){
      try{
        let scr='';
        if(V.p=='home')scr=home();
        else if(V.p=='t')scr=tbl();
        else if(V.p=='menu')scr=menuHome();
        else if(V.p=='cat')scr=menuCat(V.ci);
        else if(V.p=='set')scr=settings();
        $('#app').innerHTML=scr;
        $('#nav').innerHTML=navHTML();
        $('#nav').style.display=(V.p=='t')?'none':'';
      }catch(e){console.error('render error',e)}
    }
    function navHTML(){
      const active=V.p=='cat'?'menu':V.p;
      const items=[{p:'home',i:'🍽️',t:'الطاولات'},{p:'menu',i:'📖',t:'القائمة'},{p:'set',i:'⚙️',t:'الإعدادات'}];
      return items.map(x=>`<button class="nv ${active==x.p?'on':''}" onclick="nav('${x.p}')"><span>${x.i}</span><small>${x.t}</small></button>`).join('');
    }
    function nav(p){
      if(p=='menu'){V.p='menu';V.ci=0}
      else V.p=p;
      if(p=='home')V.d=-1;
      Q.ms='';Q.ps='';
      render();scrollTo(0,0);
    }

    function home(){
      const occ=Object.values(S.t).filter(t=>t&&t.occ).length;
      const free=S.n-occ;
      let g='';
      for(let n=1;n<=S.n;n++){
        const t=S.t[n],o=t&&t.occ;
        const k=o?(t.l||[]).reduce((a,x)=>a+x.q,0):0;
        const pe=o?(t.l||[]).filter(x=>!x.s).reduce((a,x)=>a+x.q,0):0;
        const late=o&&t.at&&(Date.now()-t.at>30*60000);
        const cls=o?(late?'occ late':'occ'):'';
        const total=o?nf(tTotal(t)):''; const mins=o?mn(t.at):'';
        g+=`<button class="tb ${cls}" onclick="openT(${n})">
          <b>${n}</b>
          <span>${o?`${t.p||0} أشخاص ${t.w?'💧'+(t.w>1?'×'+t.w:''):''}<br>${k?(pe?'⏳ '+pe+' معلّق':'✅ مكتمل'):'بلا طلبات'}${mins!==''?'<br>⏱ '+mnTxt(mins):''}`:'متاحة'}</span>
          ${total?`<span class="tot">${total} د.ع</span>`:''}
        </button>`;
      }
      return `<header>
        <h1>كابتن محمد<small>${occ} محجوزة • ${free} متاحة</small></h1>
      </header>
      <main><div class="grid">${g}</div></main>`;
    }

/* ═══ [جديدة] تبديل القسم دون إعادة رسم شريط الأقسام ═══ */
function pickerTab(ci){
  const tabsEl=document.querySelector('.tabs');
  const savedScroll=tabsEl?tabsEl.scrollLeft:0;

  V.cat=ci;
  Q.ps='';
  const psEl=document.getElementById('ps');
  if(psEl)psEl.value='';

  /* تحديث الزر النشط فقط — بدون إعادة بناء */
  if(tabsEl){
    tabsEl.querySelectorAll('button').forEach((b,idx)=>{
      b.classList.toggle('a',idx===ci);
    });
  }

  /* تحديث شبكة الوجبات فقط */
  refreshPickGrid();

  /* إعادة موضع التمرير كما كان */
  if(tabsEl)tabsEl.scrollLeft=savedScroll;
}
    function refreshPickGrid(){
      const q=Q.ps.trim();
      const cur=S.menu[V.cat]||{i:[]};
      const items=q
        ? S.menu.flatMap((m,ci)=>m.i.map((it,ii)=>({it,ci,ii}))).filter(x=>x.it.n.includes(q)||(x.it.d||'').includes(q))
        : cur.i.map((it,ii)=>({it,ci:V.cat,ii}));
      const t=T(V.n);
      const grid=items.map(({it,ci,ii})=>{
        const k=(t.l||[]).filter(x=>x.n==it.n).reduce((a,x)=>a+x.q,0);
        return `<button class="it" onclick="pick(${ci},${ii})">${h(it.n)}<small>${it.p?nf(it.p)+' د.ع':''}</small>${k?`<i>${k}</i>`:''}</button>`;
      }).join('')||'<p class="em" style="grid-column:1/-1">لا نتائج</p>';
      $('#pgrid').innerHTML=grid;
    }
    function pick(ci,j){
      const m=S.menu[ci]&&S.menu[ci].i[j];
      if(!m)return;
      const t=T(V.n),nm=m.n;
      const x=t.l.find(y=>y.n==nm&&!y.o&&!y.s);
      if(x)x.q++;else t.l.push({n:nm,q:1,o:'',pr:m.p||0});
      occ(t);if(!t.p)t.p=1;vibe();save();refreshPickGrid();
    }




function noteS(i){
  const x=T(V.n).l[i];
  if(!x){console.warn('noteS: no item at index',i);return}
  let o='';
  for(let k=1;k<=x.q;k++)o+=`<option value="${k}" ${k==1?'selected':''}>${k}</option>`;

  const chips = getChipsForItem(x.n);

  /* ═══ فصل صريح: الحار و"بدون حار" دائماً في الخيارات ═══ */
  const heatChips = ['حار', 'بدون حار'].filter(c => chips.includes(c));
  const noChips   = chips.filter(c => c.startsWith('بدون ') && c !== 'بدون حار');
  const addChips  = chips.filter(c => c.startsWith('إضافة '));
  const otherChips = chips.filter(c =>
    !c.startsWith('بدون ') &&
    !c.startsWith('إضافة ') &&
    c !== 'حار' && c !== 'بدون حار'
  ).concat(heatChips);   /* ← نضم الحار آخر الخيارات */

  const chipBtn = c => `<button type="button" class="chip" onclick="addC(this)">${c}</button>`;

  let chipsHTML = '';
  if(chips.length === 0){
    chipsHTML = `<p class="muted" style="font-size:13px;margin:8px 0;text-align:center;padding:10px;background:var(--sf);border-radius:10px;border:1px dashed var(--br)">هذي الوجبة ما تحتاج ملاحظات مكونات — اكتب أدناه إذا تريد.</p>`;
  } else {
    if(noChips.length){
      chipsHTML += `<label style="color:var(--dg);font-size:13px">🚫 بدون...</label>
        <div class="chips">${noChips.map(chipBtn).join('')}</div>`;
    }
    if(addChips.length){
      chipsHTML += `<label style="color:var(--ok);font-size:13px">➕ إضافة...</label>
        <div class="chips">${addChips.map(chipBtn).join('')}</div>`;
    }
    if(otherChips.length){
      chipsHTML += `<label style="color:var(--mu);font-size:13px">⚙️ خيارات</label>
        <div class="chips">${otherChips.map(chipBtn).join('')}</div>`;
    }
  }

  openSheet(`<h3>📝 ${h(x.n)}</h3>
    ${x.q>1?`<label>الملاحظة تنطبق على كم وحدة من ${x.q}؟<select id="cnt">${o}</select></label>`:''}
    ${chipsHTML}
    <label>الملاحظة</label>
    <textarea id="nt" rows="2" placeholder="اكتب ملاحظة...">${h(x.o)}</textarea>
    <button type="button" class="pb" style="width:100%" onclick="saveN(${i})">حفظ الملاحظة</button>`);
}






    function addC(b){
      const e=$('#nt');if(!e)return;

    function saveN(i){
      try{
        const l=T(V.n).l,x=l[i];
        if(!x){closeSheet();return}
        const el=$('#nt');const v=el?el.value.trim():'';
        const cel=$('#cnt');const c=cel?+cel.value:x.q;
        if(c<x.q){x.q-=c;l.splice(i+1,0,{n:x.n,q:c,o:v,s:x.s,pr:x.pr})}
        else x.o=v;
        save();closeSheet();
        toast(v?'تم حفظ الملاحظة':'تم مسح الملاحظة');

if(t.w)rowsArr.push(`<tr><td>${t.w}×</td><td>💧 ماء</td><td style="text-align:left">${nf(t.w*WATER_PRICE)}</td></tr>`);

    function copyBill(){
      const t=billText();
      if(navigator.clipboard&&navigator.clipboard.writeText){

function copyExp(){

  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(EXP_DATA).then(()=>toast('تم نسخ النص ✓')).catch(()=>fallbackCopy(EXP_DATA));
  }else fallbackCopy(EXP_DATA);
}

function shareExp(){
  if(!EXP_DATA){uiAlert('لا توجد بيانات، أعد التصدير');return}
  if(navigator.share){
    navigator.share({title:'كابتن محمد',text:EXP_DATA}).catch(()=>{});
  }else{
    copyExp();
  }
}

async function downloadExp(){
  if(!EXP_DATA){uiAlert('لا توجد بيانات، أعد التصدير');return}

  try{
    if(navigator.canShare && navigator.share){
      const file = new File(
        [EXP_DATA],
        EXP_FILENAME || 'captain-data.json',
        {type:'application/json'}
      );
      if(navigator.canShare({files:[file]})){
        await navigator.share({files:[file], title:'كابتن محمد'});
        toast('تمت المشاركة ✓');
        return;
      }
    }
  }catch(err){
    if(err && err.name === 'AbortError') return;
    console.warn('share failed', err);
  }

  let triedDataURL = false;
  try{
    const a = document.createElement('a');
    a.href = 'data:application/json;charset=utf-8,' + encodeURIComponent(EXP_DATA);
    a.download = EXP_FILENAME || 'captain-data.json';
    document.body.appendChild(a);
    a.click();
    a.remove();
    triedDataURL = true;
  }catch(e){
    console.warn('dataURL failed', e);
  }

  setTimeout(()=>{
    uiAlert(
      (triedDataURL
        ? 'أُرسل طلب التنزيل.\n\n📌 ابحث عن الملف في:\n• مجلد Downloads\n• تطبيق "الملفات" أو File Manager ← التنزيلات\n\n'
        : '⚠️ هذا التطبيق لا يدعم تنزيل الملفات مباشرة.\n\n') +
      '💡 الحل الأكيد:\nاستخدم زر "📋 نسخ النص" والصقه في:\n• تطبيق Notes أو Notepad\n• أو أرسله لنفسك في واتساب/تيليجرام\n\nثم احفظه كملف .txt — البيانات كاملة.'
    );
  }, 800);
}

function updateImportInfo(){

  info.textContent = v.length.toLocaleString('en-US') + ' حرف (' + kb + ' KB)';
  const trimmed = v.trim();
  const lastChar = trimmed.slice(-1) || '—';
  tail.textContent = lastChar;

function clearImport(){

function cleanJSONString(raw){
  if(!raw)return'';
  return String(raw)
    .replace(/^\uFEFF/,'')
    .replace(/[\u200B-\u200F\u202A-\u202E\u2060\uFEFF]/g,'')
    .replace(/\u00A0/g,' ')
    .trim();
}

function tryParseJSON(raw){
  if(!raw)throw new Error('النص فارغ');
  const s1=cleanJSONString(raw);
  try{return JSON.parse(s1)}catch(e1){}
  const s2=s1
    .replace(/[\u201C\u201D\u201E\u201F]/g,'"')
    .replace(/[\u2018\u2019\u201A\u201B]/g,"'");
  try{return JSON.parse(s2)}catch(e2){
    const m=(e2.message||'').match(/position\s+(\d+)/i);
    if(m){
      const pos=+m[1];
      const start=Math.max(0,pos-25);
      const end=Math.min(s2.length,pos+25);
      const snip=s2.slice(start,end).replace(/\s+/g,' ');
      throw new Error('JSON غير صالح عند الحرف '+pos+' تقريباً:\n…'+snip+'…');
    }
    throw new Error('JSON غير صالح — '+(e2.message||'خطأ غير معروف'));
  }
}

 function doImport(type){
  const el=$('#impData');if(!el)return;
  const raw=el.value.trim();
  if(!raw){uiAlert('الصق النص أولاً');return}

  if(!raw.endsWith('}')){
    const tail=(raw.trim().slice(-30)||'—');
    uiAlert('⚠️ النص لا ينتهي بـ } — يبدو مقطوعاً.\n\nآخر 30 حرف:\n…'+tail+'\n\n💡 الحل:\n• انسخ الجزء المتبقي والصقه في نفس المربع (سيُضاف)\n• أو استخدم "➕ لصق (إضافة)" لجمع الأجزاء\n\nإن كنت واثقاً أن النص كامل، اضغط استيراد مرة أخرى.');
    return;
  }

  let d;
  try{
    d=tryParseJSON(raw);
  }catch(e){
    uiAlert('تعذر قراءة النص:\n\n'+e.message+'\n\n💡 جرب زر "📁 من ملف" بدلاً من اللصق.');
    return;
  }

  if(!d||typeof d!=='object'||Array.isArray(d)){uiAlert('البيانات غير صالحة (يجب أن تكون كائناً)');return}
  if(!d.menu||!Array.isArray(d.menu)){uiAlert('لا يحتوي على قائمة طعام (حقل menu مفقود)');return}
  if(d.menu.length===0){uiAlert('القائمة المستوردة فارغة');return}

  const cleanMenu=d.menu.map(c=>({
    c:String(c&&c.c||'بدون اسم'),
    i:(c&&Array.isArray(c.i)?c.i:[]).map(it=>({
      n:String(it&&it.n||''),
      p:+((it&&it.p)||0),
      d:String(it&&it.d||'')
    })).filter(it=>it.n)
  })).filter(c=>c.c);

  const totalItems=cleanMenu.reduce((s,c)=>s+c.i.length,0);

  if(type==='menu'){
    uiConfirm(`استبدال قائمة الطعام الحالية بـ ${cleanMenu.length} قسم و ${totalItems} وجبة؟`,()=>{
      S.menu=cleanMenu;
      save();
      V.p='menu';V.ci=0;Q.ms='';
      closeSheet();
      toast('تم استيراد القائمة ✓');
    },'استبدال');
  }else{
    const tablesCount=d.n?+d.n:11;
    uiConfirm(`استبدال كل شيء؟ (${cleanMenu.length} قسم، ${tablesCount} طاولة)`,()=>{
      S.menu=cleanMenu;
      S.n=Math.min(60,Math.max(1,tablesCount));
      S.th=d.th==='light'?'light':'dark';
      S.t=(d.t&&typeof d.t==='object')?d.t:{};
      save();
      applyTh();
      V={p:'home',n:0,ci:0,cat:0,d:-1};
      Q={ps:'',ms:''};
      closeSheet();
      toast('تم استيراد النسخة الكاملة ✓');
    },'استبدال');
  }
}

function importFile(){
  if(window.showOpenFilePicker){
    window.showOpenFilePicker({
      types:[{description:'JSON أو نص',accept:{'application/json':['.json','.txt'],'text/plain':['.txt']}}],
      multiple:false
    }).then(async handles => {
      const file = await handles[0].getFile();
      const text = await file.text();
      loadImportText(text);
    }).catch(err => {
      if(err && err.name === 'AbortError') return;
      fallbackFileInput();
    });
    return;
  }
  fallbackFileInput();
}

function fallbackFileInput(){
  const inp = document.createElement('input');
  inp.type = 'file';
  inp.accept = '.json,.txt,application/json,text/plain';
  inp.style.position = 'fixed';
  inp.style.left = '-9999px';
  document.body.appendChild(inp);

  let pickerOpened = false;
  const onFocus = () => { pickerOpened = true; };
  window.addEventListener('focus', onFocus, {once:true});

  inp.onchange = e => {
    const f = e.target.files[0];
    inp.remove();
    if(!f) return;
    const r = new FileReader();
    r.onload = () => loadImportText(r.result||'');
    r.onerror = () => uiAlert('تعذر قراءة الملف');
    r.readAsText(f, 'UTF-8');
  };

  inp.click();

  setTimeout(()=>{
    window.removeEventListener('focus', onFocus);
    if(!pickerOpened && (!inp.files || !inp.files.length)){
      inp.remove();
      uiAlert(
        '⚠️ هذا التطبيق لا يدعم فتح ملفات من الجهاز.\n\n' +
        '💡 الحل الوحيد:\n' +
        '• انسخ النص من الملف\n' +
        '• اضغط مطوّلاً داخل مربع الاستيراد\n' +
        '• اختر "لصق"\n' +
        '• إذا نزل جزء فقط، كرر — سيُضاف للباقي\n\n' +
        'ستعرف أن النص اكتمل عندما يصبح "آخر حرف" باللون الأخضر ( } ).'
      );
    }
  }, 3000);
}

function loadImportText(text){
  if(!text) return;
  if(text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
  const el = $('#impData');
  if(el){ el.value = text; }
  updateImportInfo();
  const kb = (text.length/1024).toFixed(1);
  toast('تم تحميل ' + kb + ' كيلوبايت ✓ — اضغط استيراد');
}

async function pasteFromClipboard(appendMode){
  try{
    if(!navigator.clipboard || !navigator.clipboard.readText){
      uiAlert('القراءة المباشرة من الحافظة غير مدعومة في هذا التطبيق.\n\nالحل:\n١. اضغط مطوّلاً داخل المربع\n٢. اختر "لصق" من القائمة\n٣. إذا نزل جزء فقط، كرر — سيُضاف للباقي');
      return;
    }
    const text = await navigator.clipboard.readText();
    if(!text || !text.trim()){ uiAlert('الحافظة فارغة. انسخ النص أولاً.'); return }
    const ta = $('#impData');
    if(!ta){ uiAlert('أعد فتح النافذة'); return }
    if(appendMode){
      ta.value += text;
    } else {
      ta.value = text;
    }
    updateImportInfo();
    toast('تم لصق ' + text.length.toLocaleString('en-US') + ' حرف' + (appendMode ? ' (مضاف)' : ''));
  }catch(e){
    console.error('paste error', e);
    uiAlert('تعذر القراءة التلقائية من الحافظة.\n\nالحل:\n١. اضغط مطوّلاً في المربع\n٢. اختر "لصق"\n٣. إذا نزل جزء فقط، كرر — سيُضاف للباقي');
  }
}

          <p class="em" style="padding:24px 0 10px;font-size:13px">كابتن محمد • إدارة الطاولات<br>البيانات محفوظة محلياً في جهازك</p>
        </main>`;
    }
    function askClearTables(){uiConfirm('تفريغ كل الطاولات؟',()=>{S.t={};save();render();toast('تم تفريغ الطاولات')},'نعم، فرّغ')}
    function resetAll(){uiConfirm('إعادة ضبط كل شيء؟ لا يمكن التراجع.',()=>{localStorage.removeItem(KEY);S=JSON.parse(JSON.stringify(DEF));save();render();toast('تم إعادة الضبط')},'نعم، أعد الضبط')}
    function tcount(d){const n=S.n+d;if(n<1||n>60)return;if(d<0&&S.t[S.n]&&S.t[S.n].occ){uiAlert('الطاولة '+S.n+' محجوزة، أفرغها أولاً');return}delete S.t[S.n];S.n=n;save();render()}

    function applyTh(){document.documentElement.dataset.theme=S.th||'dark'}
    function theme(){S.th=(S.th||'dark')=='dark'?'light':'dark';save();applyTh();render()}

    let DLG_OK=null,DLG_PROMPT=null;
    function _dlg(html){$('#dlgc').innerHTML=html;$('#dlg').hidden=false}
    function closeDlg(){$('#dlg').hidden=true;$('#dlgc').innerHTML='';DLG_OK=null;DLG_PROMPT=null}
    function dlgYes(){const cb=DLG_OK;closeDlg();if(cb)try{cb()}catch(e){console.error(e)}}
    function dlgPromptOk(){const cb=DLG_PROMPT,v=$('#dpi')?$('#dpi').value:'';closeDlg();if(cb)try{cb(v)}catch(e){console.error(e)}}
    function uiConfirm(msg,cb,okTxt){DLG_OK=cb;DLG_PROMPT=null;
      _dlg(`<h3 style="margin:0 0 10px">تأكيد</h3>
        <p style="margin:0 0 16px;line-height:1.8;color:var(--mu)">${h(msg)}</p>
        <div style="display:flex;gap:10px">
          <button type="button" class="db" style="flex:1;padding:14px;border-radius:14px;font-weight:800" onclick="dlgYes()">${h(okTxt||'تأكيد')}</button>
          <button type="button" class="gp" style="flex:1;padding:14px;border-radius:14px;font-weight:800" onclick="closeDlg()">إلغاء</button>
        </div>`);
    }
    function uiAlert(msg,cb){DLG_OK=cb;DLG_PROMPT=null;
      _dlg(`<h3 style="margin:0 0 10px">تنبيه</h3>
        <p style="margin:0 0 16px;line-height:1.8;color:var(--mu)">${h(msg)}</p>
        <button type="button" class="pb" style="width:100%;padding:14px;border-radius:14px;font-weight:800" onclick="dlgYes()">حسناً</button>`);
    }
    function uiPrompt(title,def,cb){DLG_PROMPT=cb;DLG_OK=null;
      _dlg(`<h3 style="margin:0 0 10px">${h(title)}</h3>
        <input id="dpi" value="${h(def||'')}" placeholder="اكتب هنا...">
        <div style="display:flex;gap:10px">
          <button type="button" class="pb" style="flex:1;padding:14px;border-radius:14px;font-weight:800" onclick="dlgPromptOk()">حفظ</button>
          <button type="button" class="gp" style="flex:1;padding:14px;border-radius:14px;font-weight:800" onclick="closeDlg()">إلغاء</button>
        </div>`);
    }

    let toastTimer=null,undoAction=null;
    function toast(msg,action){
      undoAction=action||null;
      const el=$('#toast');
      el.classList.remove('on');
      void el.offsetWidth;
      el.innerHTML=`<span>${h(msg)}</span>`
        +(action?'<button type="button" onclick="doUndo()">تراجع</button>':'')
        +'<button type="button" class="tclose" onclick="hideToast()" aria-label="إغلاق">✕</button>';
      el.classList.add('on');
      if(toastTimer)clearTimeout(toastTimer);
      toastTimer=setTimeout(hideToast,3500);
    }
    function hideToast(){
      if(toastTimer){clearTimeout(toastTimer);toastTimer=null}
      const el=$('#toast');
      el.classList.remove('on');
      undoAction=null;
    }
    function doUndo(){const a=undoAction;hideToast();if(a)try{a()}catch(e){console.error(e)}}
    document.addEventListener('visibilitychange',()=>{if(!document.hidden)hideToast()});

    window.hwBack=()=>{
      if(!$('#dlg').hidden){closeDlg();return true}
      if(!$('#sh').hidden){closeSheet();return true}
      if(V.p=='cat'){backToMenu();return true}
      if(V.p!='home'){V.p='home';render();return true}
      return false;
    };

    applyTh();
    render();
    setInterval(()=>{if(V.p=='home'&&$('#sh').hidden&&$('#dlg').hidden)render()},30000);
</script></body></html>
